; PHP settings for InfinityFree
; Letakkan file ini di folder /htdocs/ bersama project Laravel

; Ekstensi yang diperlukan Laravel
extension=pdo_mysql
extension=mysqli
extension=mbstring
extension=openssl
extension=tokenizer
extension=json
extension=ctype
extension=fileinfo
extension=bcmath
extension=xml

; Upload settings
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Session
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 1440

; Display errors (matikan di production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
